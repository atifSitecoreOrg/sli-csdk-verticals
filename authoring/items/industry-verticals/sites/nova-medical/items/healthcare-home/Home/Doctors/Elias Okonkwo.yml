    - ID: "3ac1a186-26b7-4845-9048-443c0dd0e487"
      Hint: Bio
      Value: "<p>Dr. Elias Okonkwo provides primary care for children from the newborn period through adolescence. He focuses on asthma, nutrition, and school-age health, and he builds treatment plans that fit a family's routine. Parents know him for plain language and for following up when a symptom does not settle. At Nova Medical he coordinates with the hospital team whenever a child needs same-day support.</p>"
