      Hint: Bio
      Value: <p>Dr. Hannah Bergstrom treats bone, joint, and sports injuries, from fractures to worn knees and shoulders. She prefers to restore movement with therapy and careful timing of surgery, and she operates when that is the safer path back to activity. Patients see her for a clear explanation of recovery, including what they can do in the first weeks. She practices at Nova Medical with the physiotherapy and imaging teams.</p>
