      Hint: Bio
      Value: "<p>Dr. Tomasz Wojcik treats retinal disease, dry eye, and age-related changes in sight. He is deliberate about when observation is enough and when a procedure should not wait. Patients leave with written drop schedules and a date to return. He is a senior clinician in the Nova Medical ophthalmology clinic.</p>"
