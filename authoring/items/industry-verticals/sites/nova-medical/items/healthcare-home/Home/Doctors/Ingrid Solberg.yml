      Hint: Bio
      Value: "<p>Dr. Ingrid Solberg cares for people receiving chemotherapy, immunotherapy, and long-term follow-up after cancer treatment. She watches side effects closely and adjusts plans so treatment stays tolerable. Her notes to patients list the symptoms that should prompt a same-day call. She works with the Nova Medical oncology team.</p>"
