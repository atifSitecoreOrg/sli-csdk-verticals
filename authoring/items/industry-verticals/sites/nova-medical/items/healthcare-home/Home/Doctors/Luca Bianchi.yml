      Value: <p>Dr. Luca Bianchi evaluates reflux, abdominal pain, inflammatory bowel disease, and liver concerns. He uses endoscopy when it will change management, and he says so when a watchful period is safer. Diet advice is tied to the diagnosis rather than a long list of restrictions. He practices at Nova Medical gastroenterology.</p>
