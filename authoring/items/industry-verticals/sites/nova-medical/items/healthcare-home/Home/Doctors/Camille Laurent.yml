      Hint: Bio
      Value: <p>Dr. Camille Laurent provides pregnancy care and gynecologic consultations, including high blood pressure in pregnancy and planning for birth. She reviews each visit against the stage of pregnancy and writes down warning signs. Her style is calm and specific, especially when a plan needs to change. She practices in the Nova Medical women's health service.</p>
