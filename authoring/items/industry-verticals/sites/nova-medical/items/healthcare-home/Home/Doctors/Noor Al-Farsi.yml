    - ID: "3ac1a186-26b7-4845-9048-443c0dd0e487"
      Hint: Bio
      Value: "<p>Dr. Noor Al-Farsi cares for adults with mood, trauma-related, and psychotic disorders. She explains benefits and side effects of treatment in language people can repeat to their family. She works with therapists at Nova Medical so medication is not the only tool. Patients know how to reach the clinic if symptoms worsen between appointments.</p>"
