    - ID: "3ac1a186-26b7-4845-9048-443c0dd0e487"
      Hint: Bio
      Value: <p>Dr. Priya Nandakumar cares for infants, children, and teenagers, with a practice built around prevention, growth, and clear conversations with families. She follows vaccinations, development, and everyday illnesses, and she takes time to explain what parents should watch for at home. Her visits are unhurried, so children can ask questions and caregivers leave with a plan they understand. She works closely with Nova Medical specialists when a child needs further evaluation.</p>
