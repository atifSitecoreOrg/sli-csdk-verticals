      Hint: Bio
      Value: "<p>Dr. Patrick Mwangi performs general surgery for hernias, gallbladder disease, and other abdominal conditions that need an operation. He explains the procedure, the scar, and the days after surgery before a date is set. Non-operative care is offered when it is genuinely appropriate. He operates with the Nova Medical surgical service.</p>"
