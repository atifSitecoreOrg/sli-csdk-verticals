      Hint: Bio
      Value: <p>Dr. Robert Lang cares for chronic kidney disease, difficult blood pressure, and electrolyte problems. He explains kidney numbers in context, including what can be slowed and what needs closer monitoring. Medicine lists are reviewed for drugs that strain the kidneys. He practices with the Nova Medical kidney service.</p>
