      Hint: Bio
      Value: <p>Dr. Aisha Rahman cares for people with complex breathlessness, lung nodules, and recovery after chest infection. She explains scans in plain terms and is clear about which findings need a biopsy. Smoking cessation and pulmonary rehabilitation are offered as treatment, not afterthoughts. She works with the Nova Medical lung service.</p>
