      Value: <p>Dr. Yara Mansour treats bowel symptoms, celiac disease, and disorders of the liver and pancreas. She reviews medicines that irritate the gut and builds a plan patients can follow between visits. Her explanations cover what a normal result rules out and what still needs watching. She is part of the Nova Medical digestive health clinic.</p>
