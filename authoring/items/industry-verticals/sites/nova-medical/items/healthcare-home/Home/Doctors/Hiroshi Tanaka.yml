    - ID: "3ac1a186-26b7-4845-9048-443c0dd0e487"
      Hint: Bio
      Value: "<p>Dr. Hiroshi Tanaka interprets X-ray, ultrasound, CT, and MRI studies for the Nova Medical clinical teams. He reports findings in a way referring doctors can act on, and he is available when a result is unexpected. He also explains selected imaging to patients when they are seen in clinic. His work supports diagnosis across specialties rather than a single disease.</p>"
