    - ID: "3ac1a186-26b7-4845-9048-443c0dd0e487"
      Hint: Bio
      Value: "<p>Dr. Mateo Alvarez specializes in joint pain, tendon injury, and return-to-work planning after orthopedic surgery. He reviews imaging with patients in the room so they can see what is injured and what is not. His plans mix injection, rehabilitation, and surgery only when lesser treatment has not held. He is part of the Nova Medical musculoskeletal service.</p>"
