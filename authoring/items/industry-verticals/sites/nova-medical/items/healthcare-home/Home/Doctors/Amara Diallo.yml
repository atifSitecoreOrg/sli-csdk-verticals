      Value: <p>Dr. Amara Diallo provides medical and surgical eye care, including cataracts, glaucoma, and diabetic eye disease. She explains test results in everyday language and schedules treatment before vision is allowed to slip. Her clinic time includes both routine examinations and urgent drops in vision. She practices with the Nova Medical eye service.</p>
