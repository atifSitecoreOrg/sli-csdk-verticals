      Hint: Bio
      Value: "<p>Dr. Leila Haddad evaluates headaches, seizures, numbness, and changes in memory or balance. She builds a history carefully, then uses examination and selected tests rather than ordering everything at once. Patients value her habit of writing the next step down before they leave. She consults across Nova Medical for stroke follow-up and complex neurological symptoms.</p>"
