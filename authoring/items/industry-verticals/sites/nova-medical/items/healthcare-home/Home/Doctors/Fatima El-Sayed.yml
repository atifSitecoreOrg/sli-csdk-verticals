    - ID: "3ac1a186-26b7-4845-9048-443c0dd0e487"
      Hint: Bio
      Value: "<p>Dr. Fatima El-Sayed treats acne, eczema, psoriasis, and suspicious skin lesions. She examines the skin in good light, explains what is inflammatory and what needs a biopsy, and sets a routine people can keep. Sun protection and early review of changing moles are part of her standard advice. She consults at Nova Medical dermatology.</p>"
