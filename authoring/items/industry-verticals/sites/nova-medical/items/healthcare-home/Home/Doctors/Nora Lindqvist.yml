      Hint: Bio
      Value: <p>Dr. Nora Lindqvist looks after high blood pressure, heart rhythm problems, and recovery after a cardiac event. She pairs medication with practical advice on activity, sleep, and salt, and she revisits the plan when numbers do not move. Her consultations leave room for questions about risk and about what can wait. She works in the Nova Medical heart clinic alongside the existing cardiology team.</p>
