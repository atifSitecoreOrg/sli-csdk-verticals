      Hint: Bio
      Value: "<p>Dr. Chloe Bennett provides medical dermatology for rashes, hair and nail disorders, and skin cancer checks. She prefers stepwise treatment and tells patients how long a cream should take to work. When a lesion should come off, she explains the scar and the follow-up before the procedure. She is part of the Nova Medical skin clinic.</p>"
