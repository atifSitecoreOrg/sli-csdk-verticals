      Hint: Bio
      Value: "<p>Dr. Daniel Cho treats asthma, chronic lung disease, cough, and sleep-related breathing problems. He uses lung function tests to decide whether treatment is working, and he teaches inhaler technique rather than assuming it. Patients with a flare leave with a written step-up plan. He consults in the Nova Medical respiratory clinic.</p>"
