      Hint: Bio
      Value: <p>Dr. Helena Petrov looks after adults and older patients in general practice, with particular attention to several conditions at once. She simplifies medicine lists and checks which tablets are still earning their place. Her manner is unhurried, and she writes down the plan before the visit ends. She practices in the Nova Medical family clinic.</p>
