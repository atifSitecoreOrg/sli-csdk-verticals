      Hint: Bio
      Value: "<p>Dr. Grace Adeyemi provides whole-person primary care for adults, from annual reviews to new symptoms that are not yet sorted. She keeps a problem list current and coordinates referrals so patients are not repeating their story. Prevention, including blood pressure, screening, and vaccines, is built into routine visits. She is a family physician at Nova Medical.</p>"
