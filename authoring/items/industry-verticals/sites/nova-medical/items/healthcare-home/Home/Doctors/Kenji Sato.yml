      Hint: Bio
      Value: <p>Dr. Kenji Sato cares for people with migraine, neuropathy, Parkinson's disease, and other disorders of the nervous system. He explains how a condition may change over months, and he adjusts medication with attention to side effects and daily function. Families are welcome in his visits when decisions are shared. He works with Nova Medical rehabilitation and imaging when a diagnosis needs more than one view.</p>
